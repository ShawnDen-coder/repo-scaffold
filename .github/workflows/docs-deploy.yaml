name: 📚 Deploy Documentation
on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to deploy
        required: true
        type: string
jobs:
  deploy:
    uses: ShawnDen-coder/repo-scaffold/.github/workflows/reusable-docs-deploy.yaml@0.27.0
    with:
      tag: ${{ inputs.tag || github.ref_name }}
    secrets: inherit
