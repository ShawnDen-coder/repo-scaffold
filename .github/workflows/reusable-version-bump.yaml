name: Reusable Version Bump

on:
  workflow_call:
    inputs:
      node-version:
        description: Node.js version used by the workflow
        required: false
        type: string
        default: "22"
      pnpm-version:
        description: pnpm version used by the workflow
        required: false
        type: string
        default: "10.12.4"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    if: "!startsWith(github.event.head_commit.message, 'chore(version):')"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ inputs.pnpm-version }}
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Cocogitto bump
        uses: cocogitto/cocogitto-action@v3
        with:
          release: true
