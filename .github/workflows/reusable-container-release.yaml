name: Reusable Container Release

on:
  workflow_call:
    inputs:
      tag:
        description: Existing release tag to build
        required: true
        type: string
      containerfile:
        description: Path to the container build file
        required: false
        default: ./container/Dockerfile
        type: string
      push-latest:
        description: Also update the latest image tag
        required: false
        default: true
        type: boolean
    secrets:
      PYPI_SERVER_USERNAME:
        required: false
      PYPI_SERVER_PASSWORD:
        required: false

permissions:
  contents: read
  packages: write

jobs:
  push-to-registry:
    name: Push container image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
      - name: Validate release tag
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release tag: $RELEASE_TAG" >&2
            exit 1
          fi
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Log in to GitHub Container Registry
        uses: redhat-actions/podman-login@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build image
        id: build-image
        uses: redhat-actions/buildah-build@v3
        with:
          image: ${{ github.repository }}
          tags: ${{ inputs.push-latest && 'latest ' || '' }}${{ github.sha }} ${{ inputs.tag }}
          containerfiles: ${{ inputs.containerfile }}
          platforms: linux/amd64,linux/arm64
          build-args: |
            PYPI_SERVER_USERNAME=${{ secrets.PYPI_SERVER_USERNAME }}
            PYPI_SERVER_PASSWORD=${{ secrets.PYPI_SERVER_PASSWORD }}
      - name: Push to registry
        uses: redhat-actions/push-to-registry@v3
        with:
          image: ${{ steps.build-image.outputs.image }}
          tags: ${{ steps.build-image.outputs.tags }}
          registry: ghcr.io
