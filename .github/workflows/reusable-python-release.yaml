name: Reusable Python Release

on:
  workflow_call:
    inputs:
      tag:
        description: Existing release tag to build and publish
        required: true
        type: string
      workspace:
        description: Build and publish changed distributions in a uv workspace
        required: false
        type: boolean
        default: false
      deploy-docs:
        description: Deploy documentation after creating the release
        required: false
        type: boolean
        default: true
      publish-container:
        description: Build and publish the project container to GHCR
        required: false
        type: boolean
        default: false
      containerfile:
        description: Path to the container build file
        required: false
        default: ./container/Dockerfile
        type: string
      push-latest:
        description: Also update the latest image tag
        required: false
        default: true
        type: boolean
    secrets:
      PYPI_TOKEN:
        required: false
      PYPI_SERVER_USERNAME:
        required: false
      PYPI_SERVER_PASSWORD:
        required: false

permissions:
  contents: write
  id-token: write
  packages: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - name: Validate release tag
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release tag: $RELEASE_TAG" >&2
            exit 1
          fi
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
      - name: Build distributions
        env:
          WORKSPACE: ${{ inputs.workspace }}
        run: |
          if [[ "$WORKSPACE" == "true" ]]; then
            uvx --from rust-just just build-changed
          else
            uvx --from rust-just just build
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish-pypi:
    needs: build
    if: vars.PUBLISH_TO_PUBLIC_PYPI == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: astral-sh/setup-uv@v10.0.1
      - name: Publish to PyPI
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_TOKEN }}
        run: uv publish

  publish-private-pypi:
    needs: build
    runs-on: ubuntu-latest
    env:
      PYPI_SERVER_USERNAME: ${{ secrets.PYPI_SERVER_USERNAME }}
      PYPI_SERVER_PASSWORD: ${{ secrets.PYPI_SERVER_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: astral-sh/setup-uv@v10.0.1
      - name: Publish to private PyPI server
        run: uvx --from rust-just just publish-pypi-server

  release:
    needs: [publish-pypi, publish-private-pypi]
    if: >-
      ${{
        always() &&
        needs.publish-private-pypi.result == 'success' &&
        (needs.publish-pypi.result == 'success' || needs.publish-pypi.result == 'skipped')
      }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: Release ${{ inputs.tag }}
          files: |
            dist/*.tar.gz
            dist/*.whl
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ github.token }}

  docs:
    needs: release
    if: always() && needs.release.result == 'success' && inputs.deploy-docs
    uses: ./.github/workflows/reusable-docs-deploy.yaml
    with:
      tag: ${{ inputs.tag }}
    secrets:
      PYPI_SERVER_USERNAME: ${{ secrets.PYPI_SERVER_USERNAME }}
      PYPI_SERVER_PASSWORD: ${{ secrets.PYPI_SERVER_PASSWORD }}

  container:
    needs: release
    if: always() && needs.release.result == 'success' && inputs.publish-container
    uses: ./.github/workflows/reusable-container-release.yaml
    with:
      tag: ${{ inputs.tag }}
      containerfile: ${{ inputs.containerfile }}
      push-latest: ${{ inputs.push-latest }}
    secrets:
      PYPI_SERVER_USERNAME: ${{ secrets.PYPI_SERVER_USERNAME }}
      PYPI_SERVER_PASSWORD: ${{ secrets.PYPI_SERVER_PASSWORD }}
