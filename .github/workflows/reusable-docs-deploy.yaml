name: Reusable Documentation Deploy

on:
  workflow_call:
    inputs:
      tag:
        description: Existing release tag to deploy
        required: true
        type: string
    secrets:
      PYPI_SERVER_USERNAME:
        required: false
      PYPI_SERVER_PASSWORD:
        required: false

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ github.token }}
      UV_INDEX_HOMELAB_USERNAME: ${{ secrets.PYPI_SERVER_USERNAME }}
      UV_INDEX_HOMELAB_PASSWORD: ${{ secrets.PYPI_SERVER_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - name: Validate release tag
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release tag: $RELEASE_TAG" >&2
            exit 1
          fi
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Build and deploy documentation
        run: uvx --from rust-just just deploy-gh-pages
