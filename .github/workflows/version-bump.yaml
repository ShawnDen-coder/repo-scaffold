name: 🔄 Auto Version Bump
on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:
    inputs:
      release-version:
        description: Explicit release version, for example 1.0.0
        required: false
        type: string
permissions:
  contents: write
concurrency:
  group: version-bump-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    if: ${{ !startsWith(github.event.head_commit.message, 'chore(version):') }}
    runs-on: ubuntu-latest
    name: Bump version and update changelog with cocogitto
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Cocogitto release
        id: release
        uses: cocogitto/cocogitto-action@v3
        with:
          release: ${{ inputs.release-version == '' }}
          git-user: 'cog-bot'
          git-user-email: 'cog-bot@users.noreply.github.com'
      - name: Explicit Cocogitto release
        if: ${{ inputs.release-version != '' }}
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.release-version }}
        run: |-
          if [[ ! "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release version: $RELEASE_VERSION"
            exit 1
          fi
          git config user.name "cog-bot"
          git config user.email "cog-bot@users.noreply.github.com"
          cog bump --version "$RELEASE_VERSION"
