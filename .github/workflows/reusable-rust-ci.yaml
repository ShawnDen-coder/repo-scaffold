name: Reusable Rust CI

on:
  workflow_call:
    inputs:
      rust-toolchain:
        description: Rust toolchain channel
        required: false
        type: string
        default: stable
      test-container:
        description: Build the project container after Rust tests pass
        required: false
        type: boolean
        default: false
      containerfile:
        description: Path to the container build file
        required: false
        type: string
        default: ./container/Dockerfile

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      SQLX_OFFLINE: true
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: pass
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ inputs.rust-toolchain }}
          components: clippy, rustfmt
      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-
      - name: Check formatting
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy -- -D warnings
      - name: Build
        run: cargo build
      - name: Test
        run: cargo test

  container-build-test:
    if: inputs.test-container
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Verify container definition
        run: test -f "${{ inputs.containerfile }}"
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Test container build
        uses: redhat-actions/buildah-build@v3
        with:
          image: ${{ github.event.repository.name }}-test
          tags: test-${{ github.sha }}
          containerfiles: ${{ inputs.containerfile }}
          platforms: linux/amd64,linux/arm64
