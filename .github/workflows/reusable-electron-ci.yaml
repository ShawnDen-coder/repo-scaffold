name: Reusable Electron CI

on:
  workflow_call:
    inputs:
      node-version:
        description: Node.js version used by the workflow
        required: false
        type: string
        default: "22"
      pnpm-version:
        description: pnpm version used by the workflow
        required: false
        type: string
        default: "10.12.4"
      lint-command:
        description: Command used for format and lint verification
        required: true
        type: string
      build-command:
        description: Command used to build Web and shared packages
        required: true
        type: string
      test-command:
        description: Optional command used to run tests
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ inputs.pnpm-version }}
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint and format check
        run: ${{ inputs.lint-command }}
      - name: Build
        run: ${{ inputs.build-command }}
      - name: Test
        if: inputs.test-command != ''
        run: ${{ inputs.test-command }}
