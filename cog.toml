from_latest_tag = true
ignore_merge_commits = true
branch_whitelist = ["master", "main"]
skip_ci = "[skip ci]"

pre_bump_hooks = [
    "echo 'bumping from {{latest|0.0.0}} to {{version|0.0.1}}'",
    "uv version {{version|0.0.1}}",
    "uv lock --no-upgrade",
]

post_bump_hooks = [
    "git push",
    "git push origin {{version}}",
]

[changelog]
path = "CHANGELOG.md"
template = "remote"
remote = "github.com"
owner = "ShawnDen-coder"
repository = "repo-scaffold"
