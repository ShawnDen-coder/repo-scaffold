name: 🔄 Auto Version Bump
on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:
permissions:
  contents: write
  id-token: write
  packages: write
concurrency:
  {% raw %}group: version-bump-${{ github.ref }}{% endraw %}
  cancel-in-progress: false
jobs:
  release:
    {% raw %}if: ${{ !startsWith(github.event.head_commit.message, 'chore(version):') }}{% endraw %}
    runs-on: ubuntu-latest
    name: Bump packages and update changelogs with cocogitto
    outputs:
      {% raw %}released: ${{ steps.version.outputs.released }}
      tag: ${{ steps.version.outputs.tag }}{% endraw %}
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          {% raw %}token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}{% endraw %}

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Cocogitto monorepo release
        id: release
        uses: cocogitto/cocogitto-action@v4
        with:
          release: true
          git-user: 'cog-bot'
          git-user-email: 'cog-bot@users.noreply.github.com'

      - name: Resolve global release tag
        id: version
        shell: bash
        run: |
          tag="$(git tag --points-at HEAD | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1 || true)"
          if [[ -z "$tag" ]]; then
            echo "No package release required"
            echo "released=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "released=true" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  publish:
    needs: release
    {% raw %}if: needs.release.outputs.released == 'true'{% endraw %}
    uses: ./.github/workflows/package-release.yaml
    with:
      {% raw %}tag: ${{ needs.release.outputs.tag }}{% endraw %}
      deploy_docs: true
    secrets: inherit
