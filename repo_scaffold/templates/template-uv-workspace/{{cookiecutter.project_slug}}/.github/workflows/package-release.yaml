name: 🚀 Release Build & Publish
on:
  workflow_call:
    inputs:
      tag:
        description: Existing global release tag to build and publish
        required: true
        type: string
      deploy_docs:
        description: Deploy documentation for this release
        required: false
        type: boolean
        default: true
  workflow_dispatch:
    inputs:
      tag:
        description: Existing global release tag to build and publish
        required: true
        type: string
      deploy_docs:
        description: Deploy documentation for this release
        required: false
        type: boolean
        default: false
permissions:
  contents: write
  id-token: write
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          {% raw %}ref: ${{ inputs.tag }}{% endraw %}
          fetch-depth: 0
      - name: Validate release tag
        shell: bash
        env:
          {% raw %}RELEASE_TAG: ${{ inputs.tag }}{% endraw %}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release tag: $RELEASE_TAG" >&2
            exit 1
          fi
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Build changed distributions
        run: uvx --from rust-just just build-changed
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish-pypi:
    needs: build
    runs-on: ubuntu-latest
    if: vars.PUBLISH_TO_PUBLIC_PYPI == 'true'
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          {% raw %}ref: ${{ inputs.tag }}{% endraw %}
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: astral-sh/setup-uv@v5
      - name: Publish to PyPI
        env:
          {% raw %}UV_PUBLISH_TOKEN: ${{ secrets.PYPI_TOKEN }}{% endraw %}
        run: uvx --from rust-just just publish-pypi

  publish-private-pypi:
    needs: build
    runs-on: ubuntu-latest
    env:
      {% raw %}PYPI_SERVER_USERNAME: ${{ secrets.PYPI_SERVER_USERNAME }}
      PYPI_SERVER_PASSWORD: ${{ secrets.PYPI_SERVER_PASSWORD }}{% endraw %}
    steps:
      - uses: actions/checkout@v4
        with:
          {% raw %}ref: ${{ inputs.tag }}{% endraw %}
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: astral-sh/setup-uv@v5
      - name: Publish to private PyPI server
        run: uvx --from rust-just just publish-pypi-server

  release:
    needs: [publish-pypi, publish-private-pypi]
    # A disabled public PyPI publish is an intentional skip, not a release failure.
    if: >-
      {% raw %}${{
        always() &&
        needs.publish-private-pypi.result == 'success' &&
        (needs.publish-pypi.result == 'success' || needs.publish-pypi.result == 'skipped')
      }}{% endraw %}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          {% raw %}ref: ${{ inputs.tag }}{% endraw %}
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          {% raw %}tag_name: ${{ inputs.tag }}
          name: Release ${{ inputs.tag }}{% endraw %}
          files: |
            dist/*.tar.gz
            dist/*.whl
          generate_release_notes: true
        env:
          {% raw %}GITHUB_TOKEN: ${{ github.token }}{% endraw %}

  docs:
    needs: release
    {% raw %}if: ${{ always() && needs.release.result == 'success' && inputs.deploy_docs }}{% endraw %}
    uses: ./.github/workflows/docs-deploy.yaml
    with:
      {% raw %}tag: ${{ inputs.tag }}{% endraw %}
    secrets: inherit
