name: 🚀 Release Build & Publish
on:
  workflow_call:
    inputs:
      tag:
        description: Existing global release tag to build and publish
        required: true
        type: string
      deploy_docs:
        description: Deploy documentation for this release
        required: false
        type: boolean
        default: true
  workflow_dispatch:
    inputs:
      tag:
        description: Existing global release tag to build and publish
        required: true
        type: string
      deploy_docs:
        description: Deploy documentation for this release
        required: false
        type: boolean
        default: false
jobs:
  release:
    uses: ShawnDen-coder/repo-scaffold/.github/workflows/reusable-python-release.yaml@0.30.0
    with:
      {% raw %}tag: ${{ inputs.tag }}
      workspace: true
      deploy-docs: ${{ inputs.deploy_docs }}{% endraw %}
    secrets: inherit
