name: 📚 Deploy Documentation
on:
  workflow_call:
    inputs:
      tag:
        description: Existing global release tag to deploy
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Existing global release tag to deploy
        required: true
        type: string
permissions:
  contents: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      {% raw %}GITHUB_TOKEN: ${{ github.token }}
      UV_INDEX_HOMELAB_USERNAME: ${{ secrets.PYPI_SERVER_USERNAME }}
      UV_INDEX_HOMELAB_PASSWORD: ${{ secrets.PYPI_SERVER_PASSWORD }}{% endraw %}
    steps:
      - uses: actions/checkout@v4
        with:
          {% raw %}ref: ${{ inputs.tag }}{% endraw %}
      - name: Validate release tag
        shell: bash
        env:
          {% raw %}RELEASE_TAG: ${{ inputs.tag }}{% endraw %}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release tag: $RELEASE_TAG" >&2
            exit 1
          fi
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Build and deploy documentation
        run: uvx --from rust-just just deploy-gh-pages
