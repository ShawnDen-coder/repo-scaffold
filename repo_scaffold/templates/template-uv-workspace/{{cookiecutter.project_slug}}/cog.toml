ignore_merge_commits = true
branch_whitelist = ["master", "main"]
skip_ci = "[skip ci]"

generate_mono_repository_global_tag = true
generate_mono_repository_package_tags = true
monorepo_version_separator = "-"

pre_bump_hooks = [
    "echo 'bumping from {% raw %}{{latest|0.0.0}}{% endraw %} to {% raw %}{{version|0.0.1}}{% endraw %}'",
    "uv lock --no-upgrade",
]

post_bump_hooks = [
    "git push",
    "git push --tags",
]

[changelog]
path = "CHANGELOG.md"
template = "remote"
remote = "github.com"
owner = "{{cookiecutter.github_username}}"
repository = "{{cookiecutter.project_slug}}"
package_template = "remote"

[packages.{{cookiecutter.package_slug}}]
path = "packages/{{cookiecutter.package_slug}}"
public_api = true
changelog_path = "packages/{{cookiecutter.package_slug}}/CHANGELOG.md"
pre_bump_hooks = [
    "echo 'bumping {{cookiecutter.package_slug}} from {% raw %}{{latest|0.0.0}}{% endraw %} to {% raw %}{{version|0.0.1}}{% endraw %}'",
    "uv version --package {{cookiecutter.package_slug}} {% raw %}{{version|0.0.1}}{% endraw %}",
]
