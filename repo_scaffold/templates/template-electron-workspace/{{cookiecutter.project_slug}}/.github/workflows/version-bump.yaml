name: Version Bump

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      release-version:
        description: Explicit release version, for example 1.0.0
        required: false
        type: string

jobs:
  version-bump:
    uses: ShawnDen-coder/repo-scaffold/.github/workflows/reusable-version-bump.yaml@0.31.0
    with:
      node-version: '{{cookiecutter.node_version}}'
      pnpm-version: 10.12.4
