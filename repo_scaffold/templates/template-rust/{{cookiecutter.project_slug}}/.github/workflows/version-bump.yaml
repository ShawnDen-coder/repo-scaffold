name: 🔄 Auto Version Bump
on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:
    inputs:
      release-version:
        description: Explicit release version, for example 1.0.0
        required: false
        type: string
permissions:
  contents: write
concurrency:
  {% raw %}group: version-bump-${{ github.ref }}{% endraw %}
  cancel-in-progress: false
jobs:
  release:
    {% raw %}if: ${{ !startsWith(github.event.head_commit.message, 'chore(version):') }}{% endraw %}
    runs-on: ubuntu-latest
    name: Bump version and update changelog with cocogitto
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          {% raw %}token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}{% endraw %}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-workspaces
        run: cargo install cargo-workspaces --locked

      - name: Cocogitto release
        id: release
        uses: cocogitto/cocogitto-action@v3
        with:
          release: {% raw %}${{ inputs.release-version == '' }}{% endraw %}
          git-user: 'cog-bot'
          git-user-email: 'cog-bot@users.noreply.github.com'
      - name: Explicit Cocogitto release
        if: {% raw %}${{ inputs.release-version != '' }}{% endraw %}
        shell: bash
        env:
          RELEASE_VERSION: {% raw %}${{ inputs.release-version }}{% endraw %}
        run: |
          if [[ ! "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release version: $RELEASE_VERSION"
            exit 1
          fi
          git config user.name "cog-bot"
          git config user.email "cog-bot@users.noreply.github.com"
          cog bump --version "$RELEASE_VERSION"
