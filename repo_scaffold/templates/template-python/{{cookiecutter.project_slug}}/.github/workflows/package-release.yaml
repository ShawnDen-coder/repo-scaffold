name: 🚀 Release Build & Publish
on:
  workflow_call:
    inputs:
      tag:
        description: Existing release tag to build and publish
        required: true
        type: string
      deploy_docs:
        description: Deploy documentation for this release
        required: false
        type: boolean
        default: true
      publish_container:
        description: Publish the project container to GHCR
        required: false
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build and publish
        required: true
        type: string
      deploy_docs:
        description: Deploy documentation for this release
        required: false
        type: boolean
        default: false
      publish_container:
        description: Publish the project container to GHCR
        required: false
        type: boolean
        default: false
jobs:
  release:
    uses: ShawnDen-coder/repo-scaffold/.github/workflows/reusable-python-release.yaml@0.27.0
    with:
      {% raw %}tag: ${{ inputs.tag }}
      workspace: false
      deploy-docs: ${{ inputs.deploy_docs }}
      publish-container: ${{ inputs.publish_container }}{% endraw %}
    secrets: inherit
