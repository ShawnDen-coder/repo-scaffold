name: 🐳 Container Release
on:
  workflow_call:
    inputs:
      tag:
        description: Existing release tag to build
        required: true
        type: string
      push_latest:
        description: Also update the latest image tag
        required: false
        default: true
        type: boolean
    secrets:
      PYPI_SERVER_USERNAME:
        required: false
      PYPI_SERVER_PASSWORD:
        required: false
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build
        required: true
        type: string
      push_latest:
        description: Also update the latest image tag
        required: false
        default: true
        type: boolean
jobs:
  release:
    uses: ShawnDen-coder/repo-scaffold/.github/workflows/reusable-container-release.yaml@0.30.0
    with:
      {% raw %}tag: ${{ inputs.tag }}
      containerfile: ./container/Dockerfile
      push-latest: ${{ inputs.push_latest }}{% endraw %}
    secrets:
      {% raw %}PYPI_SERVER_USERNAME: ${{ secrets.PYPI_SERVER_USERNAME }}
      PYPI_SERVER_PASSWORD: ${{ secrets.PYPI_SERVER_PASSWORD }}{% endraw %}
