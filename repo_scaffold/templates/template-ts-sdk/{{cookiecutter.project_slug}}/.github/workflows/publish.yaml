name: Publish

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Version tag to publish (without the v prefix)
        required: true
        type: string

jobs:
  release:
    uses: ShawnDen-coder/repo-scaffold/.github/workflows/reusable-node-release.yaml@0.31.0
    with:
      {% raw %}tag: ${{ inputs.version && format('v{0}', inputs.version) || github.ref_name }}{% endraw %}
      publish-npm: true
      publish-gpr: true
      github-package-name: '@{{cookiecutter.github_username}}/{{cookiecutter.project_slug}}'
    secrets:
      {% raw %}NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      PERSONAL_ACCESS_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}{% endraw %}
