name: Version Bump

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      release-version:
        description: Explicit release version, for example 1.0.0
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  version-bump:
    runs-on: ubuntu-latest
    if: "!startsWith(github.event.head_commit.message, 'chore(version):')"

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

{% include '_shared/steps/pnpm-setup.yaml' %}

      - name: Cocogitto bump
        uses: cocogitto/cocogitto-action@v3
        with:
          release: {% raw %}${{ inputs.release-version == '' }}{% endraw %}
