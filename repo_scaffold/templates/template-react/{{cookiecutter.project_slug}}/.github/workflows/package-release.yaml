name: 🚀 Release Build & Publish

on:
  push:
    tags: ['[0-9]+.[0-9]+.[0-9]+']

jobs:
  release:
    uses: ShawnDen-coder/repo-scaffold/.github/workflows/reusable-node-release.yaml@0.31.0
    with:
      {% raw %}tag: ${{ github.ref_name }}{% endraw %}
      publish-npm: false
      publish-gpr: false
